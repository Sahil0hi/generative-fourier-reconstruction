name: genai-reconstruction
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26,<3
  - scipy>=1.11,<2
  - matplotlib>=3.8,<4
  - scikit-learn>=1.4,<2
  - threadpoolctl>=3.1,<4
  - jupyterlab>=4,<5
  - nbconvert>=7,<8
  - nbformat>=5,<6
  - ipykernel>=6,<8
  - pip
  - pip:
      - torch>=2.2,<3
      - torchvision>=0.17,<1
      # Included for the required Stage 3–4 data, although Stage 1 uses MNIST.
      - medmnist>=2.2,<4
